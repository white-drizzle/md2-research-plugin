<style>
.atlas {
  --night: #1d202a;
  --panel: #252833;
  --rule: #414452;
  --light: #f0eff5;
  --soft: #c0c2d0;
  --lavender: #c4aeff;
  color: var(--light);
  background: var(--night);
  border: 1px solid var(--rule);
  border-radius: 12px;
  font: 15px/1.6 var(--sans);
}
.atlas *, .atlas *::before, .atlas *::after { box-sizing: border-box; }
.atlas [hidden] { display: none !important; }
.atlas button, .atlas select { font: inherit; color: inherit; cursor: pointer; }
.atlas :is(button, select, a, [tabindex]):focus-visible { outline: 2px solid var(--lavender); outline-offset: 2px; }
.atlas-top, .atlas-bar, .atlas-filters, .atlas-tools, .atlas-legend, .atlas-view, .atlas-jump {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
}
.atlas-top, .atlas-bar { justify-content: space-between; }
.atlas-top { padding: 12px 16px; border-radius: 11px 11px 0 0; background: var(--panel); border-bottom: 1px solid var(--rule); }
.atlas-top h2 { display: flex; align-items: center; gap: 9px; margin: 0; font: 650 20px/1.3 var(--sans); color: var(--light); }
.atlas-top svg { width: 21px; height: 21px; color: var(--lavender); }
.atlas-filters { gap: 4px; }
.atlas-filters button, .atlas-view button, .atlas-jump select {
  border: 1px solid transparent; border-radius: 5px; padding: 5px 9px;
  background: transparent; color: var(--soft); font-size: 13px;
}
.atlas-filters button { max-width: 100%; overflow-wrap: anywhere; }
.atlas-filters button[aria-pressed="true"] { background: #3c384c; color: var(--light); border-color: #796a95; }
.atlas-filters button:hover, .atlas-view button:enabled:hover { background: #393c49; color: white; }
.atlas-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--node-color); vertical-align: 1px; }
.atlas-body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(255px, 23vw, 330px); }
.atlas-canvas { min-width: 0; }
.atlas-viewport {
  position: relative; display: flex; flex-direction: column; height: clamp(330px, 54vh, 550px);
  overflow: scroll; scrollbar-width: thin; scrollbar-color: #666a7b var(--night); overflow-anchor: none; cursor: grab;
  background: radial-gradient(#3b3e4a .8px, transparent 1px) 0 0 / 19px 19px, var(--night);
}
.atlas-viewport:focus-visible { outline-offset: -3px !important; }
.atlas-viewport.drag { cursor: grabbing; user-select: none; }
.atlas-sheet { position: relative; flex: none; margin: auto; overflow: clip; }
.atlas-scene { position: absolute; left: 0; top: 0; transform-origin: top left; }
.atlas-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.atlas-edge { fill: none; stroke-width: 1.5; stroke-linecap: round; opacity: .67; vector-effect: non-scaling-stroke; }
.atlas-edge.shared { stroke-dasharray: 4 5; }
.atlas-edge.on { stroke-width: 2.4; opacity: 1; }
.atlas-edge.faint { opacity: .23; }
.atlas .atlas-node {
  position: absolute; transform: translateX(-50%); display: flex; flex-direction: column;
  align-items: center; gap: 4px; padding: 0 2px 3px; border: 0; border-radius: 5px;
  background: transparent; color: var(--node-color); line-height: 1.25;
}
.atlas-symbol { display: grid; place-items: center; width: 36px; height: 36px; }
.atlas-mark { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.atlas-node.branch .atlas-mark, .atlas-node.root .atlas-mark { outline: 1px solid currentColor; outline-offset: 4px; }
.atlas-node.branch .atlas-mark { width: 18px; height: 18px; }
.atlas-node.root .atlas-mark { display: grid; place-items: center; width: 26px; height: 26px; }
.atlas-node.root svg { width: 15px; height: 15px; color: #342b46; }
.atlas-node.shared .atlas-mark { outline: 1px dashed currentColor; outline-offset: 3px; }
.atlas-node.evidence .atlas-mark { border-radius: 1px; transform: rotate(45deg); }
.atlas-node[aria-pressed="true"] .atlas-symbol, .atlas-node:hover .atlas-symbol {
  border-radius: 50%; box-shadow: 0 0 0 2px currentColor; background: #ffffff18;
}
.atlas-label {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  max-width: 100%; overflow-wrap: anywhere; color: var(--light); font: 500 14px/1.3 var(--sans);
  text-shadow: -1px -1px 2px var(--night), 1px 1px 2px var(--night), 0 0 4px var(--night);
}
.atlas-node:is(.root, .branch) .atlas-label { font-size: 16px; font-weight: 650; }
.atlas-node.dim .atlas-label { color: #b1b3c1; }
.atlas-node.dim .atlas-mark { opacity: .65; }
.atlas-bar { padding: 7px 12px; border-top: 1px solid var(--rule); }
.atlas-legend, .atlas-jump { color: var(--soft); font-size: 12px; }
.atlas-legend span { white-space: nowrap; }
.atlas-legend i { margin-right: 4px; font-style: normal; }
.atlas-jump select { max-width: min(13ch, 35vw); background: var(--panel); color-scheme: dark; }
.atlas-view { flex-wrap: nowrap; gap: 3px; }
.atlas-view button, .atlas-jump select { min-height: 32px; border-color: var(--rule); color: var(--light); }
.atlas-view button:disabled { opacity: .45; cursor: default; }
.atlas-view output { min-width: 3.5em; color: var(--soft); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
.atlas-reader {
  min-width: 0; padding: 18px; border-left: 1px solid var(--rule); border-radius: 0 0 11px 0;
  background: var(--panel); overflow-wrap: anywhere;
}
.atlas-role { color: var(--node-color); font-size: 12px; font-weight: 650; }
.atlas-reader h3 { margin: 4px 0 12px; font: 650 23px/1.35 var(--sans); color: var(--light); }
.atlas-reader p { margin: 0 0 12px; }
.atlas-detail { padding-left: 10px; border-left: 2px solid var(--node-color); color: #dadbe4; }
.atlas-reader h4 { margin: 17px 0 5px; font: 600 13px/1.5 var(--sans); color: var(--soft); }
.atlas-links { display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 14px; }
.atlas-links a { color: #d9caff; text-underline-offset: 3px; }
.atlas-evidence:not(:empty) {
  margin: 10px 0; padding: 8px; border-radius: 5px; overflow: auto; background: var(--surface); color: var(--ink);
}
.atlas-evidence figure { margin: 0; }
.atlas-evidence img { max-width: 100%; height: auto; }
.atlas-neighbors { padding: 0; margin: 0; list-style: none; }
.atlas-neighbors li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
.atlas-neighbors button { padding: 2px 0; border: 0; background: transparent; text-align: left; overflow-wrap: anywhere; }
.atlas-neighbors button:hover { color: var(--lavender); text-decoration: underline; }
.atlas-neighbors small { color: var(--soft); text-align: right; }
.atlas-hint { margin: 7px 0; font: 13px/1.5 var(--sans); color: var(--muted); }
@media (max-width: 940px) {
  .atlas-body { grid-template-columns: minmax(0, 1fr); }
  .atlas-reader { border-left: 0; border-top: 1px solid var(--rule); border-radius: 0 0 11px 11px; }
}
@media (max-width: 620px) {
  .atlas-top, .atlas-reader { padding: 12px; }
  .atlas-viewport { height: clamp(260px, 44vh, 370px); }
  .atlas-bar { padding: 7px 9px; }
  .atlas-tools { justify-content: space-between; width: 100%; }
  .atlas-filters button { padding: 4px 7px; }
}
</style>
<section class="atlas" aria-labelledby="atlas-title">
  <header class="atlas-top">
    <h2 id="atlas-title"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="m4 16 7-10 9 5-7 8-9-3m7-10 2 13" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="16" r="2"/><circle cx="11" cy="6" r="2.5"/><circle cx="20" cy="11" r="2"/><circle cx="13" cy="19" r="2"/></svg>文献鸟瞰</h2>
    <div class="atlas-filters" id="atlas-filters" role="group" aria-label="查看分支"></div>
  </header>
  <div class="atlas-body">
    <div class="atlas-canvas">
      <div class="atlas-viewport" id="atlas-viewport" role="group" aria-label="论文关系图" aria-describedby="atlas-hint" tabindex="0">
        <div class="atlas-sheet" id="atlas-sheet"><div class="atlas-scene" id="atlas-scene"></div></div>
      </div>
      <div class="atlas-bar">
        <div class="atlas-legend" id="atlas-legend" role="group" aria-label="图例"></div>
        <div class="atlas-tools">
          <label class="atlas-jump">定位节点<select id="atlas-index"></select></label>
          <div class="atlas-view" role="group" aria-label="图面缩放">
            <button type="button" data-view="out" aria-label="缩小">−</button><output id="atlas-scale" aria-label="缩放比例">100%</output>
            <button type="button" data-view="in" aria-label="放大">＋</button><button type="button" data-view="fit">复位</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="atlas-reader" id="atlas-reader" aria-labelledby="atlas-name">
      <div class="atlas-role" id="atlas-role"></div>
      <h3 id="atlas-name" tabindex="-1" aria-live="polite" aria-atomic="true"></h3>
      <p id="atlas-summary"></p><p class="atlas-detail" id="atlas-detail"></p>
      <div class="atlas-evidence" id="atlas-evidence"></div>
      <div class="atlas-links" id="atlas-links"></div>
      <section id="atlas-related" aria-labelledby="atlas-related-title">
        <h4 id="atlas-related-title">相连节点</h4><ul class="atlas-neighbors" id="atlas-neighbors"></ul>
      </section>
    </aside>
  </div>
</section>
<p class="atlas-hint" id="atlas-hint">点选节点可阅读说明和出处，或沿相连节点继续阅读。拖动图面可平移，滚轮或缩放按钮可调整大小。</p>
<script>
(() => {
  const { root, nodes, edges } = Guide.data;
  const byId = new Map(nodes.map(node => [node.id, node]));
  const branches = nodes.filter(node => node.kind === 'branch');
  const groups = new Map(branches.map(node => [node.id, [node]]));
  for (const node of nodes) {
    if (node.group && node.kind !== 'branch') groups.get(node.group).push(node);
  }
  const shared = nodes.filter(node => node.kind === 'shared');
  const incident = new Map(nodes.map(node => [node.id, []]));
  for (const edge of edges) {
    incident.get(edge.from).push(edge);
    if (edge.from !== edge.to) incident.get(edge.to).push(edge);
  }
  const otherEnd = (edge, id) => edge.from === id ? edge.to : edge.from;
  const roles = { root: '研究全貌', branch: '研究分支', method: '方法', evidence: '证据', shared: '共用节点' };
  const palette = ['#86d6bd', '#f0b887', '#9abef7', '#e9a8c5', '#d5cc88'];
  const colors = new Map(branches.map((node, i) => [node.id, palette[i % palette.length]]));
  const color = node => colors.get(node.group) || 'var(--lavender)';
  const labels = new Map();
  const labelText = document.createElement('span');
  for (const node of nodes) {
    Guide.text(labelText, node.label);
    labels.set(node.id, labelText.textContent);
  }

  const get = name => document.getElementById('atlas-' + name);
  const viewport = get('viewport'), sheet = get('sheet'), scene = get('scene'), index = get('index');
  const viewButtons = document.querySelector('.atlas-view');
  const filters = new Map(), buttons = new Map();
  let scope = null, active = root, scale = 1, width = 0, height = 0, frameHeight = 0;
  const compact = () => viewport.clientWidth < 650;

  function makeButton(label) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    return button;
  }
  function addFilter(id, label) {
    const button = makeButton(label);
    button.dataset.scope = id ?? '';
    if (id !== null) {
      const dot = document.createElement('i');
      dot.className = 'atlas-dot';
      dot.style.setProperty('--node-color', colors.get(id));
      button.prepend(dot);
    }
    button.addEventListener('click', () => select(id ?? root, id, true));
    get('filters').append(button);
    filters.set(id, button);
  }
  if (branches.length) {
    addFilter(null, '全篇');
    for (const branch of branches) addFilter(branch.id, labels.get(branch.id));
  } else get('filters').hidden = true;
  for (const node of nodes) index.add(new Option(labels.get(node.id), node.id));
  index.parentElement.hidden = nodes.length === 1;
  index.addEventListener('change', () => choose(index.value));
  const symbols = { branch: '◉', method: '●', evidence: '◆', shared: '┄' };
  for (const [kind, symbol] of Object.entries(symbols)) {
    if (!nodes.some(node => node.kind === kind)) continue;
    const item = document.createElement('span'), icon = document.createElement('i');
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = symbol;
    item.append(icon, roles[kind]);
    get('legend').append(item);
  }

  function localShared() {
    if (scope === null) return shared;
    const found = new Set(), queue = groups.get(scope).slice();
    for (const node of queue) {
      for (const edge of incident.get(node.id)) {
        const neighbor = byId.get(otherEnd(edge, node.id));
        if (neighbor.kind === 'shared' && !found.has(neighbor.id)) {
          found.add(neighbor.id);
          queue.push(neighbor);
        }
      }
    }
    return shared.filter(node => found.has(node.id));
  }
  function layout() {
    const points = new Map();
    const branchList = scope === null ? branches : [byId.get(scope)];
    const sharedNodes = localShared();
    let row = 0;

    // Each label owns a cell. Longer branches continue on a new row in reading order.
    function place(items, left, space, columns, lane = false) {
      const cell = space / columns;
      for (let start = 0; start < items.length; start += columns) {
        const batch = items.slice(start, start + columns);
        const inset = lane ? 0 : (space - batch.length * cell) / 2;
        batch.forEach((node, i) => {
          const col = lane && (start / columns) % 2 ? columns - 1 - i : i;
          points.set(node.id, { x: left + inset + (col + .5) * cell, row, w: Math.min(230, cell - 8) });
        });
        row++;
      }
    }
    const paper = byId.get(root);
    const columns = Math.max(1, Math.floor(width / 126));
    if (compact() || !branchList.length) {
      if (scope !== null) {
        const [branch, ...members] = groups.get(scope);
        place([paper, branch], 0, width, Math.min(2, columns));
        place([...members, ...sharedNodes], 0, width, columns);
      } else if (byId.get(active).kind === 'shared' && compact()) {
        place([byId.get(active)], 0, width, 1);
        const neighbors = new Set(incident.get(active).map(edge => otherEnd(edge, active)));
        neighbors.delete(active);
        place(Array.from(neighbors, id => byId.get(id)), 0, width, columns);
      } else {
        place([paper], 0, width, 1);
        place(branches.length ? branches : sharedNodes, 0, width, columns);
      }
    } else {
      const rail = Math.min(190, width * .19), space = width - rail;
      const laneCols = Math.min(Math.max(1, Math.floor(space / 126)), Math.max(...branchList.map(b => groups.get(b.id).length)));
      const origin = { x: rail / 2, row: 0, w: rail - 8 };
      points.set(root, origin);
      // Put a shared node between the branch lanes it connects.
      const laneIndex = new Map(branchList.map((branch, i) => [branch.id, i]));
      const between = branchList.map(() => []);
      for (const node of sharedNodes) {
        const linked = incident.get(node.id).map(edge => laneIndex.get(byId.get(otherEnd(edge, node.id)).group))
          .filter(i => i !== undefined);
        const after = linked.length ? Math.floor((Math.min(...linked) + Math.max(...linked)) / 2) : between.length - 1;
        between[after].push(node);
      }
      branchList.forEach((branch, i) => {
        place(groups.get(branch.id), rail, space, laneCols, true);
        place(between[i], rail, space, laneCols);
      });
      origin.row = points.get(branchList[branchList.length - 1].id).row / 2;
    }
    height = Math.max(frameHeight, row * 90);
    for (const point of points.values()) point.y = (point.row + .5) * height / row - 22;
    return points;
  }

  const svgNS = 'http://www.w3.org/2000/svg';
  function edgePath(a, b) {
    const start = 'M' + a.x + ' ' + a.y;
    if (a === b) return start + 'c-26 -29 26 -29 0 0';
    if (a.x === b.x) {
      const bend = a.x + Math.min(55, a.w / 2);
      return start + 'C' + bend + ' ' + a.y + ' ' + bend + ' ' + b.y + ' ' + b.x + ' ' + b.y;
    }
    const mid = (a.x + b.x) / 2;
    const lift = a.y === b.y && Math.abs(a.x - b.x) > a.w * 1.7 ? 30 : 0;
    return start + 'C' + mid + ' ' + (a.y - lift) + ' ' + mid + ' ' + (b.y - lift) + ' ' + b.x + ' ' + b.y;
  }
  function draw() {
    width = viewport.clientWidth;
    frameHeight = viewport.clientHeight;
    if (!width) return;
    const points = layout(), near = new Set(incident.get(active).map(edge => otherEnd(edge, active)));
    const lines = document.createElementNS(svgNS, 'svg');
    lines.setAttribute('class', 'atlas-edges');
    lines.setAttribute('aria-hidden', 'true');
    for (const { from, to } of edges) {
      if (!points.has(from) || !points.has(to)) continue;
      const a = byId.get(from), b = byId.get(to);
      const common = a.kind === 'shared' || b.kind === 'shared';
      const line = document.createElementNS(svgNS, 'path');
      line.setAttribute('class', 'atlas-edge' + (common ? ' shared' : '') +
        (active === root ? '' : from === active || to === active ? ' on' : ' faint'));
      line.setAttribute('stroke', common ? 'var(--lavender)' : color(b.group ? b : a));
      line.setAttribute('d', edgePath(points.get(from), points.get(to)));
      lines.append(line);
    }
    scene.replaceChildren(lines);
    buttons.clear();
    for (const [id, point] of points) {
      const node = byId.get(id), label = labels.get(id);
      const button = makeButton('');
      button.className = 'atlas-node ' + node.kind;
      button.classList.toggle('dim', active !== root && id !== active && !near.has(id));
      button.dataset.node = id;
      button.title = label;
      button.setAttribute('aria-pressed', String(id === active));
      button.style.setProperty('--node-color', color(node));
      button.style.left = point.x + 'px';
      button.style.top = (point.y - 18) + 'px';
      button.style.width = point.w + 'px';
      const symbol = document.createElement('span'), mark = document.createElement('span');
      symbol.className = 'atlas-symbol';
      symbol.setAttribute('aria-hidden', 'true');
      mark.className = 'atlas-mark';
      if (id === root) mark.innerHTML = '<svg viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 1h8l4 4v14H2z M10 1v5h4 M5 10h6 M5 13h6"/></svg>';
      symbol.append(mark);
      const name = document.createElement('span');
      name.className = 'atlas-label';
      name.textContent = label;
      button.append(symbol, name);
      scene.append(button);
      buttons.set(id, button);
    }
    sizeScene();
  }

  function readNode() {
    const node = byId.get(active);
    get('reader').style.setProperty('--node-color', color(node));
    get('role').textContent = roles[node.kind];
    Guide.text(get('name'), node.label);
    Guide.text(get('summary'), node.summary);
    Guide.text(get('detail'), node.detail);
    get('detail').hidden = !node.detail;
    get('evidence').replaceChildren();
    Guide.evidence(get('evidence'), node);
    get('links').replaceChildren();
    Guide.links(get('links'), node);
    const list = get('neighbors');
    list.replaceChildren();
    for (const edge of incident.get(active)) {
      const id = otherEnd(edge, active);
      const li = document.createElement('li'), button = makeButton(labels.get(id)), relation = document.createElement('small');
      Guide.text(relation, edge.label);
      relation.append(edge.from === active ? ' →' : ' ←');
      button.addEventListener('click', () => {
        choose(id);
        get('name').focus({ preventScroll: true });
      });
      li.append(button, relation);
      list.append(li);
    }
    get('related').hidden = !list.children.length;
    index.value = active;
    for (const [id, button] of filters) button.setAttribute('aria-pressed', String(id === scope));
  }
  function reveal(button) {
    if (!button) return;
    const node = button.getBoundingClientRect(), view = viewport.getBoundingClientRect();
    function shift(start, end, low, high) {
      return start < low ? start - low : Math.max(0, end - high);
    }
    viewport.scrollBy(shift(node.left, node.right, view.left, view.left + viewport.clientWidth),
      shift(node.top, node.bottom, view.top, view.top + viewport.clientHeight));
  }
  function select(id, nextScope, reset = false) {
    const graphFocus = scene.contains(document.activeElement);
    const recenter = reset || nextScope !== scope;
    if (recenter) scale = 1;
    active = id;
    scope = nextScope;
    draw();
    if (recenter) home();
    readNode();
    const button = buttons.get(active);
    if (graphFocus) button?.focus({ preventScroll: true });
    reveal(button);
  }
  function choose(id) {
    if (id === root) {
      select(root, null, true);
      return;
    }
    const node = byId.get(id);
    let next = scope;
    if (node.group && (compact() || scope !== null)) next = node.group;
    else if (scope !== null && !buttons.has(id)) next = null;
    select(id, next);
  }
  scene.addEventListener('click', event => {
    const button = event.target.closest('.atlas-node');
    if (button) choose(button.dataset.node);
  });

  function sizeScene() {
    // The gutter lets the reader pan in either direction even at the initial zoom.
    scene.style.left = (width / 2) + 'px';
    scene.style.top = (frameHeight / 2) + 'px';
    scene.style.width = width + 'px';
    scene.style.height = height + 'px';
    scene.style.transform = 'scale(' + scale + ')';
    sheet.style.width = (width + width * scale) + 'px';
    sheet.style.height = (frameHeight + height * scale) + 'px';
    get('scale').textContent = Math.round(scale * 100) + '%';
    viewButtons.querySelector('[data-view="out"]').disabled = scale <= .5;
    viewButtons.querySelector('[data-view="in"]').disabled = scale >= 3;
  }
  function home() {
    viewport.scrollTo(width / 2, frameHeight / 2);
  }
  function zoom(factor, clientX, clientY) {
    const before = scene.getBoundingClientRect();
    const x = (clientX - before.left) / scale, y = (clientY - before.top) / scale;
    scale = Math.max(.5, Math.min(3, scale * factor));
    sizeScene();
    const after = scene.getBoundingClientRect();
    viewport.scrollBy(after.left + x * scale - clientX, after.top + y * scale - clientY);
  }
  viewButtons.addEventListener('click', event => {
    const action = event.target.closest('button')?.dataset.view;
    if (!action) return;
    if (action === 'fit') {
      scale = 1;
      sizeScene();
      home();
      reveal(buttons.get(active));
    } else {
      const rect = viewport.getBoundingClientRect();
      zoom(action === 'in' ? 1.25 : .8, rect.left + viewport.clientWidth / 2, rect.top + viewport.clientHeight / 2);
    }
  });
  viewport.addEventListener('wheel', event => {
    if (event.shiftKey || !event.deltaY) return;
    event.preventDefault();
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : 1);
    zoom(Math.exp(-.0015 * delta), event.clientX, event.clientY);
  }, { passive: false });
  let drag;
  viewport.addEventListener('pointerdown', event => {
    if (event.button !== 0 || event.pointerType === 'touch' || event.target.closest('button')) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add('drag');
  });
  viewport.addEventListener('pointermove', event => {
    if (drag?.id === event.pointerId) viewport.scrollTo(drag.left + drag.x - event.clientX, drag.top + drag.y - event.clientY);
  });
  viewport.addEventListener('lostpointercapture', () => {
    drag = null;
    viewport.classList.remove('drag');
  });
  new ResizeObserver(() => {
    if (!viewport.clientWidth || (width === viewport.clientWidth && frameHeight === viewport.clientHeight)) return;
    const node = byId.get(active);
    const focused = document.activeElement.dataset.node;
    if (compact() && scope === null && node.group) scope = node.group;
    draw();
    home();
    for (const [id, button] of filters) button.setAttribute('aria-pressed', String(id === scope));
    const target = buttons.get(focused) || buttons.get(active);
    if (focused !== undefined) target?.focus({ preventScroll: true });
    reveal(target);
  }).observe(viewport, { box: 'border-box' });
  select(root, null, true);
})();
</script>
